<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Manoverde</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0710;
    --bg-soft:#171022;
    --card:#1D1428;
    --ink:#F5F0FF;
    --ink-soft:#A99BC2;
    --line:#33254A;
    --pink:#FF2E9A;
    --purple:#9B3CFF;
    --cyan:#2FE0FF;
    --lime:#5CFF7A;
    --amber:#FFB020;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body{ padding-bottom:96px; }
  ::selection{ background:var(--pink); color:#0B0710; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
  .hidden{ display:none !important; }

  /* ---------- Header ---------- */
  header{
    padding:22px 20px 18px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 10% -20%, rgba(155,60,255,0.45), transparent 55%),
      radial-gradient(circle at 100% -10%, rgba(47,224,255,0.25), transparent 50%),
      var(--bg);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--cyan);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:'';
    width:6px; height:6px;
    background:var(--pink);
    border-radius:50%;
    display:inline-block;
    box-shadow:0 0 8px var(--pink);
  }
  h1.logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:42px;
    line-height:1;
    margin-top:8px;
    color:var(--lime);
    text-shadow:
      0 0 14px rgba(92,255,122,0.55),
      2px 3px 0 rgba(11,7,16,0.6);
  }
  .tagline{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:8px;
    max-width:36ch;
  }

  /* ---------- Views ---------- */
  .view{ padding-bottom:10px; }

  /* ---------- Home: category banners ---------- */
  .banners{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:18px 20px 8px;
  }
  .banner{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    height:118px;
    display:flex;
    align-items:flex-end;
    padding:14px 16px;
    cursor:pointer;
    border:1.5px solid rgba(255,255,255,0.06);
  }
  .banner:active{ transform:scale(0.98); }
  .banner .glow{
    position:absolute; inset:0;
    opacity:0.9;
  }
  .banner .icon{
    position:absolute;
    top:12px; right:14px;
    font-size:30px;
    opacity:0.5;
    filter:drop-shadow(0 0 10px rgba(255,255,255,0.25));
  }
  .banner .label{
    position:relative;
    z-index:1;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:0.01em;
    text-shadow:2px 3px 0 rgba(0,0,0,0.35);
  }
  .banner .sub{
    position:relative;
    z-index:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.75);
    margin-top:2px;
  }

  /* ---------- Category header bar ---------- */
  .cat-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 20px 4px;
    padding:12px 16px;
    border-radius:14px;
    background:linear-gradient(100deg, var(--card), rgba(255,255,255,0.02));
    border:1.5px solid var(--line);
  }
  .cat-bar .back{
    background:none; border:none;
    color:var(--cyan);
    font-size:18px;
    cursor:pointer;
  }
  .cat-bar .cat-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
  }

  /* ---------- Product grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:14px 20px 20px;
  }
  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    overflow:hidden;
    cursor:pointer;
    opacity:0;
    transform:translateY(10px);
    animation:rise 0.4s ease forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0);} }
  .card:active{ transform:scale(0.97); }

  .card-media{
    width:100%;
    aspect-ratio:1/0.9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    position:relative;
    overflow:hidden;
  }
  .card-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cbd-badge{
    position:absolute;
    top:8px; left:8px;
    background:rgba(11,7,16,0.75);
    border-radius:20px;
    padding:3px 8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:600;
    color:var(--lime);
  }
  .card-body{ padding:11px 12px 13px; }
  .card-name{ font-size:13px; font-weight:700; line-height:1.25; margin-bottom:5px; }
  .card-farm{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-soft); margin-bottom:8px; }
  .price-from{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; display:block; }
  .price{ font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:700; }

  /* ---------- Static sections (Info / Links / Avis) ---------- */
  .static-section{ padding:22px 20px 10px; }
  .static-section h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    margin-bottom:10px;
    color:var(--lime);
  }
  .static-section p{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px; }
  .link-btn{
    display:block;
    padding:14px 16px;
    border-radius:14px;
    background:linear-gradient(100deg, var(--purple), var(--pink));
    color:#fff;
    font-weight:700;
    font-size:13px;
    text-decoration:none;
    margin-bottom:10px;
  }
  .review{
    padding:12px 14px;
    border-radius:14px;
    background:var(--card);
    border:1.5px solid var(--line);
    margin-bottom:10px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .review .stars{ color:var(--amber); font-size:13px; margin-bottom:4px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed;
    left:14px; right:14px; bottom:14px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    background:var(--bg-soft);
    border-radius:24px;
    padding:8px;
    border:1.5px solid var(--pink);
    box-shadow:0 0 18px rgba(255,46,154,0.25);
    z-index:15;
  }
  .navbtn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:8px 0;
    border-radius:16px;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
  }
  .navbtn .ic{ font-size:17px; }
  .navbtn.active{
    background:rgba(255,46,154,0.14);
    color:var(--pink);
  }

  /* ---------- Cart bar ---------- */
  .cartbar{
    position:fixed;
    left:14px; right:14px; bottom:78px;
    background:linear-gradient(100deg, #7C2AE8, #C24DFF 50%, #FF2E9A);
    color:#fff;
    border-radius:26px;
    padding:11px 8px 11px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 10px 24px rgba(124,42,232,0.4);
    transform:translateY(160%);
    transition:transform 0.3s cubic-bezier(.22,1,.36,1);
    z-index:20;
  }
  .cartbar.show{ transform:translateY(0); }
  .cartbar .info{ display:flex; flex-direction:column; font-family:'IBM Plex Mono', monospace; }
  .cartbar .info .count{ font-size:10px; color:#EFE0FF; letter-spacing:0.06em; text-transform:uppercase;}
  .cartbar .info .total{ font-size:16px; font-weight:700; }
  .cartbar .view{
    background:var(--lime);
    color:#0B0710;
    border:none;
    border-radius:20px;
    padding:10px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
  }

  /* ---------- Overlay + sheets ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(6,4,10,0.65);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:30;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-height:86vh;
    background:var(--bg-soft);
    border-top:1.5px solid var(--line);
    border-radius:22px 22px 0 0;
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(.22,1,.36,1);
    z-index:31;
    display:flex;
    flex-direction:column;
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:4px; margin:10px auto 6px; flex:0 0 auto; }
  .sheet-scroll{ overflow-y:auto; }

  #productMedia{
    width:100%;
    aspect-ratio:1/0.75;
    display:flex; align-items:center; justify-content:center;
    font-size:60px;
  }
  #productMedia img{ width:100%; height:100%; object-fit:cover; }
  .product-info{ padding:16px 20px 4px; }
  .product-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .product-head h2{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:19px; line-height:1.25; }
  .close-x{ background:none; border:none; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; flex:0 0 auto; }
  .product-farm{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--cyan); margin-top:6px; }
  .product-desc{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-top:10px; }
  .tiers-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:18px 0 10px; padding:0 20px; }
  .tiers-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 20px 20px; }
  .tier-tile{
    background:linear-gradient(150deg, #3A2A57, #5B2E7A 60%, #7C2AE8);
    border-radius:14px;
    padding:14px 10px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .tier-tile .tier-label{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px; }
  .tier-tile .tier-price{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:#EFE0FF; }
  .tier-tile button{ width:38px; height:38px; border-radius:12px; border:none; background:var(--lime); color:#0B0710; font-size:18px; font-weight:700; cursor:pointer; }
  .tier-tile button:active{ transform:scale(0.92); }

  .drawer-head{ padding:6px 20px 14px; border-bottom:1.5px solid var(--line); display:flex; align-items:baseline; justify-content:space-between; }
  .drawer-head h2{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:20px; }
  .drawer-list{ padding:6px 20px; }
  .drawer-empty{ padding:40px 0; text-align:center; color:var(--ink-soft); font-size:13px; }
  .line-item{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); gap:10px; }
  .line-item .li-icon{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--bg); border-radius:10px; flex:0 0 auto; overflow:hidden; }
  .line-item .li-icon img{ width:100%; height:100%; object-fit:cover; }
  .line-item .li-name{ font-size:13px; font-weight:600; flex:1; }
  .line-item .li-name .li-tier{ color:var(--ink-soft); font-weight:500; }
  .line-item .li-price{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .li-remove{ background:none; border:none; color:var(--pink); font-size:16px; cursor:pointer; flex:0 0 auto; }
  .drawer-foot{ padding:16px 20px calc(16px + env(safe-area-inset-bottom)); border-top:1.5px solid var(--line); }
  .total-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; font-family:'IBM Plex Mono', monospace; }
  .total-row .label{ font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); }
  .total-row .amount{ font-size:22px; font-weight:700; }
  .checkout-btn{ width:100%; padding:15px 0; background:var(--lime); color:#0B0710; border:none; border-radius:26px; font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; cursor:pointer; }
  .checkout-btn:disabled{ background:var(--line); color:var(--ink-soft); }
  .fallback-note{ font-size:10px; color:var(--ink-soft); text-align:center; margin-top:10px; font-family:'IBM Plex Mono', monospace; }
#cartbar{display:none !important;}

  .shop-intro{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:var(--bg,#0B0710); overflow:hidden; }
  .shop-intro-inner{ display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:20px; position:relative; z-index:1; }
  .shop-intro-emoji{ font-size:46px; line-height:1; }
  .shop-intro-logo{ width:64px; height:64px; border-radius:16px; object-fit:cover; box-shadow:0 10px 30px rgba(0,0,0,0.35); }
  .shop-intro-name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:28px; color:var(--lime,#5CFF7A); text-shadow:0 0 14px rgba(92,255,122,0.45); }
  .shop-intro.si-fade .shop-intro-inner{ animation:siFadeIn 500ms ease; }
  .shop-intro.si-fade{ animation:siFadeOut var(--si-dur,1400ms) ease forwards; }
  .shop-intro.si-pulse .shop-intro-inner{ animation:siPulse 900ms ease; }
  .shop-intro.si-pulse{ animation:siFadeOut var(--si-dur,1600ms) ease forwards; }
  .shop-intro.si-curtain{ background:transparent; }
  .shop-intro.si-curtain::before, .shop-intro.si-curtain::after{ content:''; position:absolute; top:0; bottom:0; width:50%; background:var(--bg,#0B0710); }
  .shop-intro.si-curtain::before{ left:0; animation:siCurtainLeft var(--si-dur,1400ms) ease forwards; }
  .shop-intro.si-curtain::after{ right:0; animation:siCurtainRight var(--si-dur,1400ms) ease forwards; }
  .shop-intro.si-curtain .shop-intro-inner{ animation:siFadeIn 400ms ease, siFadeOutQuick var(--si-dur,1400ms) ease forwards; }
  @keyframes siFadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @keyframes siFadeOut{ 0%,70%{opacity:1;} 100%{opacity:0;} }
  @keyframes siFadeOutQuick{ 0%,55%{opacity:1;} 100%{opacity:0;} }
  @keyframes siPulse{ 0%{transform:scale(0.85); opacity:0;} 60%{transform:scale(1.06); opacity:1;} 100%{transform:scale(1);} }
  @keyframes siCurtainLeft{ 0%,55%{transform:translateX(0);} 100%{transform:translateX(-100%);} }
  @keyframes siCurtainRight{ 0%,55%{transform:translateX(0);} 100%{transform:translateX(100%);} }

  /*__SOLDOUT_PATCH__*/
  .sold-out-card{ filter:grayscale(0.85); opacity:0.55; }
  .soldout-badge{ position:absolute; top:8px; right:8px; background:rgba(6,4,10,0.82); color:#F5F0FF; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; padding:3px 8px; border-radius:20px; z-index:2; }

  /*__PROMO_PATCH__*/
  .tier-price-old{ text-decoration:line-through; opacity:0.55; font-size:11px; margin-right:4px; }
  .tier-price-promo{ color:var(--lime,#5CFF7A); }
  .promo-badge{ position:absolute; bottom:8px; left:8px; background:var(--pink,#FF2E9A); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:20px; z-index:2; }

  /*__PROMO_HOME_PATCH__*/
  .promo-strip-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--pink,#FF2E9A); padding:16px 20px 0; }
  .promo-strip-row{ display:flex; gap:10px; overflow-x:auto; padding:10px 20px 6px; -webkit-overflow-scrolling:touch; }
  .promo-card{ flex:0 0 128px; background:var(--card,#1D1428); border:1.5px solid var(--pink,#FF2E9A); border-radius:14px; overflow:hidden; cursor:pointer; }
  .promo-card .promo-card-media{ width:100%; height:96px; background:var(--card2,#241a33); display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; }
  .promo-card .promo-card-media img{ width:100%; height:100%; object-fit:cover; }
  .promo-card .promo-card-body{ padding:8px 10px 10px; }
  .promo-card .promo-card-name{ font-size:11px; font-weight:700; line-height:1.25; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .promo-card .promo-card-price{ font-family:'IBM Plex Mono',monospace; font-size:10px; }
  .promo-card .promo-card-price .old{ text-decoration:line-through; opacity:0.55; margin-right:4px; }
  .promo-card .promo-card-price .new{ color:var(--lime,#5CFF7A); font-weight:700; }


  /*__CATICON_PATCH_V2__*/
  .cat-icon-img{ width:1.6em; height:1.6em; object-fit:cover; border-radius:50%; display:inline-block; vertical-align:middle; }
  *:has(> .cat-icon-img){ background:transparent !important; box-shadow:none !important; border:none !important; padding:0 !important; }
</style>
</head>

oooAKKKKAP//Z"
  }
];

  // Couleur d'accent de chaque categorie, deduite automatiquement
  // du degrade "glow" ci-dessus (derniere couleur du degrade).
  // -> Tu n'as rien a faire ici, ca se met a jour tout seul.
  function extractAccentColor(glow){
    var matches = glow.match(/#[0-9A-Fa-f]{3,6}/g);
    return matches ? matches[matches.length - 1] : '#9B3CFF';
  }
  var CAT_COLORS = {};
  CATS.forEach(function(c){ CAT_COLORS[c.id] = extractAccentColor(c.glow); });

  // ---- Produits ----
  // id    : identifiant unique (p1, p2, p3...)
  // cat   : doit correspondre a un "id" de categorie ci-dessus
  // icon  : emoji si tu n'as pas de photo
  // image : lien vers une photo (laisse '' si tu utilises l'emoji)
  // name  : nom du produit
  // farm  : petite info sous le nom (origine, format...)
  // cbd   : taux affiche en badge (laisse '' pour ne pas afficher de badge)
  // desc  : description affichee dans la fiche produit
  // tiers : liste des formats/quantites avec leur prix
  var PRODUCTS = [];

  var cart = {};
  var activeCat = null;

  var viewHome = document.getElementById('viewHome');
  var viewCategory = document.getElementById('viewCategory');
  var viewInfo = document.getElementById('viewInfo');
  var viewLinks = document.getElementById('viewLinks');
  var viewAvis = document.getElementById('viewAvis');
  var bannersEl = document.getElementById('banners');
  var gridEl = document.getElementById('grid');
  var catNameEl = document.getElementById('catName');
  var backBtn = document.getElementById('backBtn');
  var bottomnav = document.getElementById('bottomnav');

  var cartbarEl = document.getElementById('cartbar');
  var cartCountEl = document.getElementById('cartCount');
  var cartTotalEl = document.getElementById('cartTotal');
  var overlayEl = document.getElementById('overlay');
  var drawerEl = document.getElementById('drawer');
  var drawerListEl = document.getElementById('drawerList');
  var drawerTotalEl = document.getElementById('drawerTotal');
  var checkoutBtn = document.getElementById('checkoutBtn');
  var fallbackNote = document.getElementById('fallbackNote');
  var productSheet = document.getElementById('productSheet');
  var productMedia = document.getElementById('productMedia');
  var productName = document.getElementById('productName');
  var productFarm = document.getElementById('productFarm');
  var productDesc = document.getElementById('productDesc');
  var tiersGrid = document.getElementById('tiersGrid');

  function fmt(n){ return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' EUR'; }
  function minPrice(p){ return Math.min.apply(null, p.tiers.map(function(t){ return (t.promo != null && t.promo !== '' && Number(t.promo) < Number(t.price)) ? Number(t.promo) : Number(t.price); })); }

  // ---------- View switching ----------
  var VIEWS = { home:viewHome, category:viewCategory, info:viewInfo, links:viewLinks, avis:viewAvis };
  function showView(name){
    Object.keys(VIEWS).forEach(function(k){ VIEWS[k].classList.toggle('hidden', k !== name); });
    bottomnav.querySelectorAll('.navbtn').forEach(function(btn){
      var tab = btn.getAttribute('data-view');
      var match = (tab === name) || (tab === 'home' && name === 'category');
      btn.classList.toggle('active', match);
    });
  }
  bottomnav.querySelectorAll('.navbtn').forEach(function(btn){
    btn.addEventListener('click', function(){ showView(btn.getAttribute('data-view')); });
  });

  // ---------- Rendu de la config (header / infos / liens / avis) ----------
  function renderHeader(){
    document.getElementById('eyebrowText').textContent = CONFIG.eyebrow;
    document.getElementById('shopNameText').textContent = CONFIG.shopName;
    document.getElementById('taglineText').textContent = CONFIG.tagline;
    document.title = CONFIG.shopName;
  
    var logoEl = document.getElementById('shopLogo');
    if (logoEl) { if (CONFIG.logo) { logoEl.src = CONFIG.logo; logoEl.classList.remove('hidden'); } else { logoEl.classList.add('hidden'); } }
  }

  function renderInfo(){
    var el = document.getElementById('infoContainer');
    el.innerHTML = CONFIG.infoParagraphs.map(function(p){
      return '<p>' + p + '</p>';
    }).join('');
  }

  function renderLinks(){
    var el = document.getElementById('linksContainer');
    el.innerHTML = CONFIG.links.map(function(l){
      var href = (l.url === 'whatsapp') ? ('https://wa.me/' + CONFIG.whatsappNumber) : l.url;
      return '<a class="link-btn" href="'+href+'" target="_blank" rel="noopener">'+l.label+'</a>';
    }).join('');
  }

  function renderReviews(){
    var el = document.getElementById('reviewsContainer');
    el.innerHTML = CONFIG.reviews.map(function(r){
      var stars = '';
      for (var i = 0; i < 5; i++) stars += (i < r.stars) ? '\u2605' : '\u2606';
      return '<div class="review"><div class="stars">'+stars+'</div>'+r.text+'</div>';
    }).join('');
  }

  // ---------- Home banners ----------
  function catIconHtml(ic){ if (ic && /^(data:image|https?:\/\/)/.test(ic)) { return '<img class="cat-icon-img" src="'+ic+'">'; } return ic; }
  function catBannerCss(c){ return c.banner ? 'linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.55)), url(\''+c.banner+'\') center/cover no-repeat' : c.glow; }
  function renderBanners(){
    bannersEl.innerHTML = '';
    CATS.forEach(function(c, i){
      var el = document.createElement('div');
      el.className = 'banner';
      el.style.animationDelay = (i * 0.05) + 's';
      el.innerHTML =
        '<div class="glow" style="background:'+c.glow+'"></div>' +
        '<span class="icon">'+catIconHtml(c.icon)+'</span>' +
        '<div><div class="label">'+c.label+'</div><div class="sub">'+c.sub+'</div></div>';
      el.addEventListener('click', function(){ openCategory(c.id); });
      bannersEl.appendChild(el);
    });
  }

  function openCategory(catId){
    activeCat = catId;
    var cat = CATS.filter(function(c){ return c.id === catId; })[0];
    catNameEl.textContent = cat.label;
    renderGrid();
    showView('category');
  }
  backBtn.addEventListener('click', function(){ showView('home'); });

  function mediaBg(cat){
    var c = CAT_COLORS[cat] || '#9B3CFF';
    return 'linear-gradient(150deg, ' + c + '33, ' + c + '11)';
  }

  function renderGrid(){
    gridEl.innerHTML = '';
    var list = PRODUCTS.filter(function(p){ return p.cat === activeCat; });
    list.forEach(function(p, i){
      var card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 0.04) + 's';
      var mediaHtml = p.image ? '<img src="'+p.image+'" alt="'+p.name+'">' : p.icon;
      var badgeHtml = p.cbd ? '<span class="cbd-badge">'+p.cbd+' CBD</span>' : '';
      card.innerHTML =
        '<div class="card-media" style="background:'+mediaBg(p.cat)+'">' + badgeHtml + mediaHtml + '</div>' +
        '<div class="card-body">' +
          '<div class="card-name">'+p.name+'</div>' +
          '<div class="card-farm">'+p.farm+'</div>' +
          '<div><span class="price-from">Des</span><span class="price">'+fmt(minPrice(p))+'</span></div>' +
        '</div>';
      if (p.soldOut) { card.classList.add('sold-out-card'); var cm = card.querySelector('.card-media'); if (cm) cm.insertAdjacentHTML('beforeend', '<span class="soldout-badge">Épuisé</span>'); }
      if (p.tiers && p.tiers.some(function(t){ return t.promo != null && t.promo !== '' && Number(t.promo) < Number(t.price); })) { var cm2 = card.querySelector('.card-media'); if (cm2) cm2.insertAdjacentHTML('beforeend', '<span class="promo-badge">PROMO</span>'); }
      card.addEventListener('click', function(){ openProduct(p); });
      gridEl.appendChild(card);
    });
  }

  function openProduct(p){
    var mediaHtml = p.image ? '<img src="'+p.image+'" alt="'+p.name+'">' : p.icon;
    productMedia.style.background = mediaBg(p.cat);
    productMedia.innerHTML = mediaHtml;
    productName.textContent = p.name;
    productFarm.textContent = p.farm + (p.cbd ? '  -  ' + p.cbd + ' CBD' : '');
    if (p.soldOut) { productFarm.textContent = productFarm.textContent + '  ·  ÉPUISÉ'; }
    productDesc.textContent = p.desc;

    tiersGrid.innerHTML = '';
    p.tiers.forEach(function(t){
      var tile = document.createElement('div');
      tile.className = 'tier-tile';
      var __hasPromo = (t.promo != null && t.promo !== '' && Number(t.promo) < Number(t.price));
      var __effPrice = __hasPromo ? Number(t.promo) : Number(t.price);
      tile.innerHTML = '<span class="tier-label">'+t.label+'</span>' + (__hasPromo ? ('<span class="tier-price-old">'+fmt(t.price)+'</span><span class="tier-price tier-price-promo">'+fmt(__effPrice)+'</span>') : ('<span class="tier-price">'+fmt(t.price)+'</span>')) + '<button>+</button>';
      tile.querySelector('button').addEventListener('click', function(){ addToCart(p, { label: t.label, price: (typeof __effPrice !== 'undefined' ? __effPrice : t.price) }); });
      if (p.soldOut) { var tb = tile.querySelector('button'); tb.disabled = true; tb.textContent = '✕'; tb.style.opacity = '0.35'; tb.style.cursor = 'not-allowed'; tile.style.opacity = '0.5'; }
      tiersGrid.appendChild(tile);
    });

    overlayEl.classList.add('show');
    productSheet.classList.add('show');
  
    /*__VIDEO_PATCH__*/
    if (p.video) { productMedia.innerHTML = '<video src="'+p.video+'" muted autoplay loop playsinline controls style="width:100%;height:100%;object-fit:cover;"></video>'; }
  }
  function closeProduct(){
    productSheet.classList.remove('show');
    if (!drawerEl.classList.contains('show')) overlayEl.classList.remove('show');
  }

  function addToCart(product, tier){
    var key = product.id + '__' + tier.label;
    if (!cart[key]) cart[key] = { product:product, tier:tier, qty:0 };
    cart[key].qty += 1;
    renderCart();
  }
  function removeLine(key){ delete cart[key]; renderCart(); }
  function cartLines(){ return Object.keys(cart).map(function(k){ return {key:k, entry:cart[k]}; }); }
  function cartTotal(){ return cartLines().reduce(function(s,l){ return s + l.entry.tier.price * l.entry.qty; }, 0); }
  function cartCount(){ return cartLines().reduce(function(s,l){ return s + l.entry.qty; }, 0); }

  function renderCart(){
    var count = cartCount();
    var total = cartTotal();
    cartbarEl.classList.toggle('show', count > 0);
    var headerCartBadgeEl = document.getElementById('headerCartBadge');
    if (headerCartBadgeEl) { headerCartBadgeEl.textContent = count; headerCartBadgeEl.classList.toggle('hidden', count === 0); }
    cartCountEl.textContent = count + (count > 1 ? ' articles' : ' article');
    cartTotalEl.textContent = fmt(total);
    drawerTotalEl.textContent = fmt(total);

    var lines = cartLines();
    if (lines.length === 0) {
      drawerListEl.innerHTML = '<div class="drawer-empty">Ton panier est vide pour l\u2019instant.</div>';
      checkoutBtn.disabled = true;
      checkoutBtn.textContent = 'Ajoute un article';
    } else {
      drawerListEl.innerHTML = lines.map(function(l){
        var p = l.entry.product, t = l.entry.tier;
        var iconHtml = p.image ? '<img src="'+p.image+'" alt="">' : p.icon;
        return '<div class="line-item">' +
          '<div class="li-icon" style="background:'+mediaBg(p.cat)+'">'+iconHtml+'</div>' +
          '<div class="li-name">'+p.name+' <span class="li-tier">'+t.label+' x'+l.entry.qty+'</span></div>' +
          '<div class="li-price">'+fmt(t.price * l.entry.qty)+'</div>' +
          '<button class="li-remove" data-key="'+l.key+'">\u2715</button>' +
        '</div>';
      }).join('');
      checkoutBtn.disabled = false;
      checkoutBtn.textContent = 'Commander - ' + fmt(total);
      drawerListEl.querySelectorAll('.li-remove').forEach(function(btn){
        btn.addEventListener('click', function(){ removeLine(btn.getAttribute('data-key')); });
      });
    }

    if (tg && tg.MainButton) {
      if (count > 0) {
        tg.MainButton.setText('Commander - ' + fmt(total));
        tg.MainButton.show();
        tg.MainButton.enable();
      } else {
        tg.MainButton.hide();
      }
    }
  }

  function openDrawer(){ overlayEl.classList.add('show'); drawerEl.classList.add('show'); }
  function closeDrawer(){
    drawerEl.classList.remove('show');
    if (!productSheet.classList.contains('show')) overlayEl.classList.remove('show');
  }
  document.getElementById('viewCartBtn').addEventListener('click', openDrawer);
  var headerCartBtnEl = document.getElementById('headerCartBtn');
  if (headerCartBtnEl) headerCartBtnEl.addEventListener('click', openDrawer);
  document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
  document.getElementById('closeProduct').addEventListener('click', closeProduct);
  overlayEl.addEventListener('click', function(){ closeDrawer(); closeProduct(); });

  function buildWhatsAppMessage(lines, total){
    var out = ['Nouvelle commande - ' + CONFIG.shopName, ''];
    lines.forEach(function(l){
      out.push(l.entry.qty + 'x ' + l.entry.product.name + ' (' + l.entry.tier.label + ') - ' + fmt(l.entry.tier.price * l.entry.qty));
    });
    out.push('');
    out.push('Total : ' + fmt(total));
    return out.join('\n');
  }

  function submitOrder(){
    var lines = cartLines();
    if (lines.length === 0) return;
    var total = cartTotal();
    var payload = {
      type: 'order',
      total: Number(total.toFixed(2)),
      items: lines.map(function(l){
        return { id:l.entry.product.id, name:l.entry.product.name, tier:l.entry.tier.label, qty:l.entry.qty, price:l.entry.tier.price };
      })
    };
    if (inTelegram && tg && tg.sendData) {
      try { tg.sendData(JSON.stringify(payload)); } catch(e){}
    }
    /*__STATS_PATCH__*/
    try {
      var __statsHost = window.location.hostname.split('.')[0];
      var __statsRepo = (window.location.pathname.split('/').filter(Boolean)[0]) || 'site';
      var __statsNs = (__statsHost + '-' + __statsRepo).replace(/[^a-zA-Z0-9_-]/g, '-');
      fetch('https://api.countapi.xyz/hit/' + __statsNs + '/orders').catch(function(){});
    } catch(__e) {}
    var text = encodeURIComponent(buildWhatsAppMessage(lines, total));
    var waUrl = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + text;
    if (inTelegram && tg && tg.openLink) { tg.openLink(waUrl); } else { window.open(waUrl, '_blank'); }
  }

  checkoutBtn.addEventListener('click', submitOrder);
  if (tg && tg.MainButton) {
    tg.MainButton.onClick(submitOrder);
    tg.MainButton.color = '#5CFF7A';
    tg.MainButton.textColor = '#0B0710';
  }

  fallbackNote.style.display = 'block';

    function initShopIntro(){
    var box = document.getElementById('shopIntroOverlay');
    if (!box) return;
    var cfg = CONFIG.intro || {};
    var type = cfg.type || 'none';
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (type === 'none' || reduced){ box.remove(); return; }
    var dur = Math.max(400, parseInt(cfg.duration, 10) || 1400);
    box.style.setProperty('--si-dur', dur + 'ms');
    box.classList.add('si-' + type);
    document.getElementById('shopIntroName').textContent = CONFIG.shopName;
    if (CONFIG.logo){
      var img = document.getElementById('shopIntroLogo');
      img.src = CONFIG.logo; img.classList.remove('hidden');
    } else if (cfg.emoji){
      var em = document.getElementById('shopIntroEmoji');
      em.textContent = cfg.emoji; em.classList.remove('hidden');
    }
    setTimeout(function(){ box.remove(); }, dur + 150);
  }
  renderHeader();
  renderInfo();
  renderLinks();
  renderReviews();
  renderBanners();
  renderCart();
})();
</script>
</body>
</html>
